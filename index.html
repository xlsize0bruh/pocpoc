<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="cache-control" content="no-store">
  <title>Safari Lock Cookie PoC</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #17202a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(680px, 100%);
      background: #ffffff;
      border: 1px solid #d9dee7;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 14px 40px rgba(23, 32, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
    }

    p {
      line-height: 1.55;
    }

    a {
      color: #1f6feb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #111418;
        color: #e8edf5;
      }

      main {
        background: #181d24;
        border-color: #303846;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Safari Lock Cookie PoC</h1>
    <p>If this page appears on Netlify, the function rewrite has not deployed yet. After Netlify redeploys, this URL should be served by <code>/.netlify/functions/poc</code>, which sets a server-side cookie and disables caching.</p>
    <p><a href="/.netlify/functions/poc?para=poc">Open the function directly</a></p>
  </main>
</body>
</html>
